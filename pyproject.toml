[project]
name = "fundhunt"
version = "0.1.0"
description = "Local-first, agent-driven finder for EU and Spanish grants, aid and public tenders"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "tacowars" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
fundhunt = "fundhunt.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
